<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小电驴的一天</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
  </style>
  <script src="/vendor/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <!-- 加载顺序不能乱：数据 → 状态 → 工具 → 场景 → main -->
  <script src="/src/config.js"></script>
  <script src="/src/lines.js"></script>
  <script src="/src/assets.js"></script>
  <script src="/src/state.js"></script>
  <script src="/src/ui.js"></script>
  <script src="/src/daily-ui.js"></script>
  <script src="/src/scenes/Boot.js"></script>
  <script src="/src/scenes/Title.js"></script>
  <script src="/src/scenes/Intro.js"></script>
  <script src="/src/scenes/FindCar.js"></script>
  <script src="/src/scenes/NodeScene.js"></script>
  <script src="/src/scenes/Ride.js"></script>
  <script src="/src/scenes/Park.js"></script>
  <script src="/src/scenes/Class.js"></script>
  <script src="/src/scenes/Charge.js"></script>
  <script src="/src/scenes/Result.js"></script>
  <script src="/src/scenes/Ending.js"></script>
  <script>// ===== 启动游戏（A 负责，最后加载）=====

// 调试：改成场景名就能直接从该场景开始，例如 'Title'、'Node'、'Ride'、'Park'、'Class'、'Charge'、'Result'、'Ending'
// 正式演示前改回 null！
const DEBUG_START = 'Ride';
// 各场景的参数：
//   Node   { kind: 'gate' | 'noon' | 'evening' }
//   Park   { pushing: true }        测推车
//   Class  { part: 'morning' | 'afternoon' }
//   Ending { key: 'perfect' | 'pass' | 'fail' | 'police' | 'faint' | 'broke' }
const DEBUG_DATA = {};
// 调试时想改初始状态，在这里改，例如 { route: 'outside', passenger: true, helmetOn: false }
// 测最终结局：{ day: 5, lateCount: 3 }
const DEBUG_STATE = {};

// 场景注册表：所有可进入的 Phaser 场景集中声明，便于检查流程和调试入口。
const GAME_SCENES = [
  Boot, Title, Intro, FindCar, NodeScene, Ride, Park, Class, Charge, Result, Ending
];

const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: 960,
  height: 540,
  backgroundColor: '#111111',
  pixelArt: false,   // 用像素风素材时改成 true（中文字会变糊，需要把字号调大）
  physics: {
    default: 'arcade',
    arcade: { gravity: { x: 0, y: 0 }, debug: false }  // debug 改 true 可以看到碰撞框
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: GAME_SCENES
});
</script>
<script>
window.addEventListener('error', e => { document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:0;color:red">'+e.message+'</pre>'); });
const check = setInterval(() => {
 const ride=game.scene.getScene('Ride');
 if (!ride.sys.isActive() || ride.time.now < 1500) return;
 clearInterval(check);
 ride.npcs.clear(true,true);
 const keys=['npc_wrong','npc_rider_green','npc_rider_helmet_blue','npc_rider_helmet_yellow','npc_rider_scooter_blue'];
 const results=keys.map((key,i) => {
 const o=ride.npcs.create(310+i*80,ride.startY-190,key).setAngle(180);
 ride.sizeNpc(o,'wrong');
 const tex=game.textures.get(key);
 const alpha=tex.context.getImageData(0,0,1,1).data[3];
 return {key,width:tex.width,height:tex.height,alpha,display:[o.displayWidth,o.displayHeight],body:[o.body.width*o.scaleX,o.body.height*o.scaleY],angle:o.angle,flipY:o.flipY,tint:o.isTinted};
 });
 ride.cameras.main.resetFX(); ride.physics.pause(); ride.scene.pause();
 const panel=document.createElement('pre'); panel.style='position:fixed;bottom:0;left:0;color:white;background:#111;font:12px monospace;margin:0';
 panel.textContent=JSON.stringify(results); document.body.appendChild(panel);
},100);
</script></body>
</html>
